name: Architecture proposal
description: Propose a change to architecture, public APIs, repository boundaries or protocol contracts
title: "[Architecture]: "
labels:
  - type:architecture
body:
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependency impact
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Include reliability, concurrency, security and industrial safety risks where relevant.
