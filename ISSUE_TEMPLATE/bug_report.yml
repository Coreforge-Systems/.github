name: Bug report
description: Report a reproducible defect in a Coreforge Systems project
title: "[Bug]: "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        Remove secrets, credentials, and customer-sensitive data before submitting.
  - type: input
    id: repository
    attributes:
      label: Component / repository
      placeholder: devicepilot-core, devicepilot-desktop, simulator...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.3.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - ESP32 / firmware
        - Simulator
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
